<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume AI Pro - AI Resume & Cover Letter Optimization</title>
  <meta name="description" content="AI-powered resume and cover letter optimization for technology jobs. Optimize keyword alignment, ATS compatibility, and clarity.">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide React Icons -->
  <script src="https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.min.js"></script>
  
  <!-- Mammoth.js for DOCX parsing -->
  <script src="https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js"></script>
  
  <style>
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    
    /* Smooth animations */
    * {
      scroll-behavior: smooth;
    }
    
    /* Loading spinner animation */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .animate-spin {
      animation: spin 1s linear infinite;
    }
    
    /* Pulse animation */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .animate-pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    // Version 26.0 - Standalone HTML version without Stripe paywall
    
    // ============================================================
    // ⚠️  API KEY CONFIGURATION - REPLACE WITH YOUR ACTUAL KEY  ⚠️
    // ============================================================
    // Get your API key from: https://console.anthropic.com/
    // Replace 'your-api-key-here' with your actual Anthropic API key
    const ANTHROPIC_API_KEY = 'your-api-key-here';
    // ============================================================
    
    const { useState, useRef } = React;
    const { Upload, FileText, Briefcase, Sparkles, Download, AlertCircle, X, File, MessageSquare, Copy, Check } = lucideReact;

    function ResumeReviewApp() {
      const [resume, setResume] = useState('');
      const [coverLetter, setCoverLetter] = useState('');
      const [jobDescription, setJobDescription] = useState('');
      const [additionalInstructions, setAdditionalInstructions] = useState('');
      const [result, setResult] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [resumeFileName, setResumeFileName] = useState('');
      const [coverLetterFileName, setCoverLetterFileName] = useState('');
      const [loadingProgress, setLoadingProgress] = useState(0);
      const [loadingStage, setLoadingStage] = useState('');
      const [activeTab, setActiveTab] = useState('resume');
      const [analyzedResume, setAnalyzedResume] = useState(false);
      const [analyzedCoverLetter, setAnalyzedCoverLetter] = useState(false);
      const [copySuccess, setCopySuccess] = useState('');
      const resultsRef = useRef(null);

      const parseResults = (text, hasResume, hasCoverLetter) => {
        const sections = { resumeAnalysis: '', resumeRecommendations: '', resumeUpdated: '', coverLetterAnalysis: '', coverLetterRecommendations: '', coverLetterUpdated: '' };
        
        if (hasResume && !hasCoverLetter) {
          const resumeSections = extractSectionsFromContent(text, 'Resume');
          sections.resumeAnalysis = resumeSections.analysis;
          sections.resumeRecommendations = resumeSections.recommendations;
          sections.resumeUpdated = resumeSections.updated;
          return sections;
        }
        
        if (hasCoverLetter && !hasResume) {
          const coverLetterSections = extractSectionsFromContent(text, 'Cover Letter');
          sections.coverLetterAnalysis = coverLetterSections.analysis;
          sections.coverLetterRecommendations = coverLetterSections.recommendations;
          sections.coverLetterUpdated = coverLetterSections.updated;
          return sections;
        }
        
        let resumeText = '';
        let coverLetterText = '';
        
        const splitPatterns = [
          /\n#{1,3}\s*COVER\s*LETTER[^\n]*/i,
          /\nCOVER\s*LETTER\s*(?:ANALYSIS|REVIEW|OUTPUT|SECTION)/i,
          /\n\*\*COVER\s*LETTER[^\n]*/i,
          /\n---+\s*\n\s*(?:#{1,3}\s*)?COVER\s*LETTER/i,
          /\nOutput\s*(?:for\s*)?Cover\s*Letter/i
        ];
        
        let splitFound = false;
        for (const pattern of splitPatterns) {
          if (pattern.test(text)) {
            const parts = text.split(pattern);
            resumeText = parts[0];
            coverLetterText = parts.slice(1).join('');
            splitFound = true;
            break;
          }
        }
        
        if (!splitFound) {
          resumeText = text;
        }
        
        if (resumeText) {
          const resumeSections = extractSectionsFromContent(resumeText, 'Resume');
          sections.resumeAnalysis = resumeSections.analysis;
          sections.resumeRecommendations = resumeSections.recommendations;
          sections.resumeUpdated = resumeSections.updated;
        }
        
        if (coverLetterText) {
          const coverLetterSections = extractSectionsFromContent(coverLetterText, 'Cover Letter');
          sections.coverLetterAnalysis = coverLetterSections.analysis;
          sections.coverLetterRecommendations = coverLetterSections.recommendations;
          sections.coverLetterUpdated = coverLetterSections.updated;
        }
        
        return sections;
      };
      
      const extractSectionsFromContent = (content, docType) => {
        let analysis = '';
        let recommendations = '';
        let updated = '';
        
        const analysisPatterns = [
          /#{1,3}\s*1[.\s:)]*\s*Analysis[^\n]*\n([\s\S]*?)(?=\n#{1,3}\s*2[.\s:)]*\s*(?:Specific\s*)?Recommend)/i,
          /#{1,3}\s*1[.\s:)]*[^\n]*(?:Strength|Analysis|Improvement)[^\n]*\n([\s\S]*?)(?=\n#{1,3}\s*2[.\s:)]*)/i,
          /#{1,3}\s*(?:Analysis|Strengths)[^\n]*\n([\s\S]*?)(?=\n#{1,3}\s*(?:Specific\s*)?Recommend)/i,
        ];
        
        const recommendationsPatterns = [
          /#{1,3}\s*2[.\s:)]*\s*(?:Specific\s*)?Recommend[^\n]*\n([\s\S]*?)(?=\n#{1,3}\s*3[.\s:)]*\s*(?:Updated|Revised))/i,
          /#{1,3}\s*2[.\s:)]*[^\n]*\n([\s\S]*?)(?=\n#{1,3}\s*3[.\s:)]*)/i,
          /#{1,3}\s*(?:Specific\s*)?Recommend[^\n]*\n([\s\S]*?)(?=\n#{1,3}\s*(?:Updated|Revised))/i,
        ];
        
        const updatedPatterns = [
          /#{1,3}\s*3[.\s:)]*\s*(?:Updated|Revised)\s*(?:Resume|Cover\s*Letter)?[^\n]*\n([\s\S]*?)$/i,
          /#{1,3}\s*3[.\s:)]*[^\n]*\n([\s\S]*?)$/i,
          /#{1,3}\s*(?:Updated|Revised)\s*(?:Resume|Cover\s*Letter)[^\n]*\n([\s\S]*?)$/i,
        ];
        
        for (const pattern of analysisPatterns) {
          const match = content.match(pattern);
          if (match && match[1]?.trim()) {
            analysis = match[1].trim();
            break;
          }
        }
        
        for (const pattern of recommendationsPatterns) {
          const match = content.match(pattern);
          if (match && match[1]?.trim()) {
            recommendations = match[1].trim();
            break;
          }
        }
        
        for (const pattern of updatedPatterns) {
          const match = content.match(pattern);
          if (match && match[1]?.trim()) {
            updated = match[1].trim();
            break;
          }
        }
        
        if (!analysis || !recommendations || !updated) {
          const section1Match = content.match(/#{1,3}\s*1[.\s:)]/i);
          const section2Match = content.match(/#{1,3}\s*2[.\s:)]/i);
          const section3Match = content.match(/#{1,3}\s*3[.\s:)]/i);
          
          if (section1Match && section2Match && section3Match) {
            const s1Index = content.indexOf(section1Match[0]);
            const s2Index = content.indexOf(section2Match[0]);
            const s3Index = content.indexOf(section3Match[0]);
            
            if (s1Index < s2Index && s2Index < s3Index) {
              const s1Content = content.substring(s1Index, s2Index);
              const s2Content = content.substring(s2Index, s3Index);
              const s3Content = content.substring(s3Index);
              
              if (!analysis) analysis = s1Content.replace(/^[^\n]*\n/, '').trim();
              if (!recommendations) recommendations = s2Content.replace(/^[^\n]*\n/, '').trim();
              if (!updated) updated = s3Content.replace(/^[^\n]*\n/, '').trim();
            }
          }
        }
        
        return { analysis, recommendations, updated };
      };

      const handleFileRead = async (file) => {
        if (file.type === 'application/pdf') {
          const ab = await file.arrayBuffer();
          const u8 = new Uint8Array(ab);
          let binary = '';
          for (let i = 0; i < u8.length; i++) {
            binary += String.fromCharCode(u8[i]);
          }
          const b64 = btoa(binary);
          const res = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: { 
              'Content-Type': 'application/json',
              'x-api-key': ANTHROPIC_API_KEY,
              'anthropic-version': '2023-06-01',
              'anthropic-dangerous-direct-browser-access': 'true'
            },
            body: JSON.stringify({
              model: 'claude-sonnet-4-20250514',
              max_tokens: 2000,
              messages: [{ role: 'user', content: [{ type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: b64 }}, { type: 'text', text: 'Extract all text from this PDF.' }]}]
            })
          });
          const data = await res.json();
          if (data.error) throw new Error('Failed to read PDF');
          return data.content.filter(i => i.type === 'text').map(i => i.text).join('\n');
        } else if (file.name.endsWith('.docx')) {
          const ab = await file.arrayBuffer();
          const r = await mammoth.extractRawText({ arrayBuffer: ab });
          if (!r.value?.trim()) throw new Error('Failed to read DOCX');
          return r.value;
        } else if (file.name.endsWith('.doc')) {
          const ab = await file.arrayBuffer();
          const u8 = new Uint8Array(ab);
          let binary = '';
          for (let i = 0; i < u8.length; i++) {
            binary += String.fromCharCode(u8[i]);
          }
          const b64 = btoa(binary);
          const res = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: { 
              'Content-Type': 'application/json',
              'x-api-key': ANTHROPIC_API_KEY,
              'anthropic-version': '2023-06-01',
              'anthropic-dangerous-direct-browser-access': 'true'
            },
            body: JSON.stringify({
              model: 'claude-sonnet-4-20250514',
              max_tokens: 2000,
              messages: [{ role: 'user', content: [{ type: 'document', source: { type: 'base64', media_type: 'application/msword', data: b64 }}, { type: 'text', text: 'Extract all text.' }]}]
            })
          });
          const data = await res.json();
          if (data.error) throw new Error('Failed to read DOC');
          return data.content.filter(i => i.type === 'text').map(i => i.text).join('\n');
        }
        return await file.text();
      };

      const handleFile = async (file, type) => {
        if (!file) return;
        try {
          const text = await handleFileRead(file);
          if (type === 'resume') { setResume(text); setResumeFileName(file.name); }
          else { setCoverLetter(text); setCoverLetterFileName(file.name); }
          setError('');
        } catch (e) {
          setError(`Error: ${e.message}`);
        }
      };

      const analyze = async () => {
        if (!resume && !coverLetter) { setError('Provide at least resume or cover letter'); return; }
        setLoading(true);
        setError('');
        setResult(null);
        setLoadingProgress(0);
        setLoadingStage('Preparing documents...');
        setActiveTab('resume');
        
        const hasResumeForAnalysis = !!resume;
        const hasCoverLetterForAnalysis = !!coverLetter;
        
        try {
          let progressInterval = setInterval(() => {
            setLoadingProgress(prev => {
              if (prev >= 30) {
                clearInterval(progressInterval);
                return prev;
              }
              return prev + 5;
            });
          }, 400);

          setLoadingStage('Reading and analyzing documents...');
          await new Promise(resolve => setTimeout(resolve, 800));

          const prompt = `You are an expert career coach, resume writer, and cover letter writer known for making TRANSFORMATIVE improvements to documents.

Analyze the provided documents and generate outputs only for the document types supplied (resume and/or cover letter). The inputs may include:      
• A resume      
• A cover letter      
• A job description      
• Additional Instructions provided by the user

Outputs (Required)  
For each document type provided, produce exactly two outputs in the following order:

Output 1: Analysis & Recommendations      
• A bulleted list with detailed analysis of strengths and areas for improvement      
• A bulleted list with specific, actionable recommendations ${jobDescription ? 'for tailoring to this job' : 'for improving the document'}      
• Focus on clarity, structure, keyword alignment, ATS compatibility, and impact      
• Explicitly call out where content is vague, overly wordy, repetitive, or lacking clarity      
• Identify weak action verbs that should be replaced with stronger alternatives
• Note any formatting, ordering, or structural improvements needed
• Reference relevant feedback driven by the job description and/or additional instructions where applicable

Output 2: Updated Document (COMPREHENSIVE REWRITE)
CRITICAL: The updated document must show VISIBLE, SUBSTANTIAL improvements. Users are paying for meaningful optimization, not minor tweaks.

You MUST apply ALL of the following transformations:

1. ACTION VERB TRANSFORMATION: Replace EVERY weak or passive verb with powerful, dynamic alternatives
   • "Responsible for" → "Spearheaded", "Orchestrated", "Drove"
   • "Helped" → "Enabled", "Facilitated", "Empowered"  
   • "Worked on" → "Engineered", "Developed", "Executed"
   • "Did" → "Delivered", "Achieved", "Accomplished"
   • "Made" → "Created", "Built", "Designed"
   • "Managed" → "Directed", "Led", "Oversaw"

2. SENTENCE STRUCTURE OPTIMIZATION: Rewrite bullets for maximum impact
   • Lead with the action verb
   • Remove filler words and redundancies
   • Combine related points for conciseness
   • Break up overly long bullets into focused statements

3. PROFESSIONAL LANGUAGE UPGRADE: Elevate the vocabulary throughout
   • Replace casual language with professional terminology
   • Use industry-standard keywords naturally
   • Ensure consistent tone and voice

4. FORMATTING & ORGANIZATION: Improve visual hierarchy and flow
   • Reorder bullets to lead with strongest achievements
   • Group related experiences logically
   • Ensure parallel structure across all bullets

5. CLARITY & CONCISENESS: Tighten all writing
   • Remove unnecessary words
   • Eliminate redundant phrases
   • Make every word count

6. ATS OPTIMIZATION: Enhance keyword density naturally
   • Incorporate relevant keywords from job description (if provided)
   • Use standard section headings
   • Avoid graphics-dependent formatting descriptions

The updated document should be NOTICEABLY different and improved from the original. A side-by-side comparison should clearly show the value of the optimization.

Accuracy & Data Integrity Constraints      
• You must NOT invent new facts, metrics, numbers, outcomes, tools, company names, or achievements
• You must ONLY use information explicitly present in the provided documents
• Do NOT add quantitative data unless it exists in the source
• You CAN and SHOULD:
  - Rephrase and restructure existing content dramatically
  - Replace weak verbs with strong action verbs
  - Reorder content for better impact
  - Improve word choice and professional tone
  - Add industry keywords that accurately describe existing experience
  - Combine or split bullets for better readability

Job Description Alignment (If Provided)      
• Actively incorporate relevant terminology and keywords from the job description
• Reorder and emphasize experiences that align with job requirements
• Mirror the language and priorities of the posting where it accurately reflects existing experience

Additional Instructions Handling (If Provided)     
• Treat the Additional Instructions as authoritative user guidance      
• Apply tone, emphasis, formatting, or customization requests fully

${resume ? `RESUME:\n${resume}\n\n` : ''}${coverLetter ? `COVER LETTER:\n${coverLetter}\n\n` : ''}${jobDescription ? `JOB DESCRIPTION:\n${jobDescription}\n\n` : ''}${additionalInstructions ? `ADDITIONAL INSTRUCTIONS:\n${additionalInstructions}\n\n` : ''}FORMAT YOUR RESPONSE EXACTLY AS FOLLOWS for each document type:

# RESUME (if provided)

## 1. Analysis: Strengths and Areas for Improvement

### Strengths
- [bullet points for strengths]

### Areas for Improvement
- [bullet points for areas needing improvement]

## 2. Specific Recommendations
- [bullet points with specific, actionable recommendations]

## 3. Updated Resume
[The complete rewritten resume content]

---

# COVER LETTER (if provided)

## 1. Analysis: Strengths and Areas for Improvement

### Strengths
- [bullet points for strengths]

### Areas for Improvement
- [bullet points for areas needing improvement]

## 2. Specific Recommendations
- [bullet points with specific, actionable recommendations]

## 3. Updated Cover Letter
[The complete rewritten cover letter content]

CRITICAL FORMATTING RULES:
- Use EXACTLY the headers shown above (## 1., ## 2., ## 3.)
- Include BOTH "### Strengths" and "### Areas for Improvement" subheaders
- Keep each section's content ONLY under its designated header
- Do NOT mix content between sections
- Complete ALL sections fully before moving to the next document type`;

          clearInterval(progressInterval);
          setLoadingProgress(40);
          setLoadingStage('Analyzing and optimizing content...');

          let apiProgressInterval = setInterval(() => {
            setLoadingProgress(prev => {
              if (prev >= 85) return prev;
              const increment = prev < 70 ? 2 : 1;
              return prev + increment;
            });
          }, 3000);

          const res = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: { 
              'Content-Type': 'application/json',
              'x-api-key': ANTHROPIC_API_KEY,
              'anthropic-version': '2023-06-01',
              'anthropic-dangerous-direct-browser-access': 'true'
            },
            body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 8000, messages: [{ role: 'user', content: prompt }]})
          });
          
          clearInterval(apiProgressInterval);
          setLoadingStage('Processing recommendations...');
          setLoadingProgress(88);
          
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          
          setLoadingStage('Finalizing optimized versions...');
          setLoadingProgress(95);
          
          await new Promise(r => setTimeout(r, 300));
          setLoadingProgress(100);
          setResult(data.content.filter(i => i.type === 'text').map(i => i.text).join('\n'));
          
          setAnalyzedResume(hasResumeForAnalysis);
          setAnalyzedCoverLetter(hasCoverLetterForAnalysis);
          
          setTimeout(() => {
            if (resultsRef.current) {
              resultsRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 100);
        } catch (e) {
          setError(`Error: ${e.message}`);
        } finally {
          setLoading(false);
          setLoadingProgress(0);
        }
      };

      const parseBoldText = (text, keyPrefix = '') => {
        if (!text) return text;
        const parts = text.split(/(\*\*[^*]+\*\*)/g);
        return parts.map((part, i) => {
          if (part.startsWith('**') && part.endsWith('**')) {
            const boldText = part.slice(2, -2);
            return React.createElement('strong', { key: `${keyPrefix}-bold-${i}`, className: "font-semibold text-slate-800" }, boldText);
          }
          return part;
        });
      };

      const formatContent = (text) => {
        if (!text) return null;
        
        const lines = text.split('\n');
        const elements = [];
        let currentList = [];
        
        lines.forEach((line, idx) => {
          const trimmed = line.trim();
          
          if (!trimmed) {
            if (currentList.length > 0) {
              elements.push(
                React.createElement('ul', { key: `list-${elements.length}`, className: "list-disc list-outside space-y-3 mb-6 ml-6 text-slate-600" }, currentList)
              );
              currentList = [];
            }
            return;
          }
          
          const bulletMatch = trimmed.match(/^[-*•]\s+(.+)$/);
          const numberMatch = trimmed.match(/^\d+\.\s+(.+)$/);
          
          if (bulletMatch || numberMatch) {
            const content = bulletMatch ? bulletMatch[1] : numberMatch[1];
            currentList.push(
              React.createElement('li', { key: `item-${idx}`, className: "leading-relaxed pl-2 mb-2 text-slate-600" }, parseBoldText(content, `item-${idx}`))
            );
          }
          else if (trimmed.startsWith('##') || trimmed.match(/^\*\*.+\*\*$/) || trimmed.match(/^[A-Z\s]{15,}:?$/)) {
            if (currentList.length > 0) {
              elements.push(
                React.createElement('ul', { key: `list-${elements.length}`, className: "list-disc list-outside space-y-3 mb-6 ml-6 text-slate-600" }, currentList)
              );
              currentList = [];
            }
            
            let headerText = trimmed
              .replace(/^##\s*/, '')
              .replace(/^\*\*/, '')
              .replace(/\*\*$/, '')
              .replace(/\*\*/g, '');
            
            elements.push(
              React.createElement('h5', { key: `header-${idx}`, className: "font-bold text-slate-800 mt-6 mb-3 text-lg" }, headerText)
            );
          }
          else {
            if (currentList.length > 0) {
              elements.push(
                React.createElement('ul', { key: `list-${elements.length}`, className: "list-disc list-outside space-y-3 mb-6 ml-6 text-slate-600" }, currentList)
              );
              currentList = [];
            }
            
            elements.push(
              React.createElement('p', { key: `para-${idx}`, className: "text-slate-600 leading-relaxed mb-4" }, parseBoldText(trimmed, `para-${idx}`))
            );
          }
        });
        
        if (currentList.length > 0) {
          elements.push(
            React.createElement('ul', { key: `list-${elements.length}`, className: "list-disc list-outside space-y-3 mb-6 ml-6 text-slate-600" }, currentList)
          );
        }
        
        return React.createElement('div', { className: "formatted-content" }, elements);
      };

      const downloadContent = async (content, filename, documentType = 'content') => {
        if (!content) {
          alert(`No ${documentType} available to download.`);
          return;
        }

        try {
          const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = filename;
          link.style.display = 'none';
          document.body.appendChild(link);
          link.click();
          setTimeout(() => {
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
          }, 100);
          return true;
        } catch (e) {
          try {
            await navigator.clipboard.writeText(content);
            setCopySuccess(documentType);
            setTimeout(() => setCopySuccess(''), 3000);
            alert(`Download was blocked. The ${documentType} has been copied to your clipboard!`);
            return true;
          } catch (clipErr) {
            alert(`Unable to download or copy the ${documentType}.`);
            return false;
          }
        }
      };

      const handleDownload = () => downloadContent(result, 'resume-review-results.txt', 'complete results');
      const handleDownloadResume = () => parsed?.resumeUpdated ? downloadContent(parsed.resumeUpdated, 'optimized-resume.txt', 'updated resume') : alert('No updated resume available.');
      const handleDownloadCoverLetter = () => parsed?.coverLetterUpdated ? downloadContent(parsed.coverLetterUpdated, 'optimized-cover-letter.txt', 'updated cover letter') : alert('No updated cover letter available.');

      const copyToClipboard = async (content, documentType) => {
        if (!content) {
          alert(`No ${documentType} available to copy.`);
          return;
        }
        try {
          await navigator.clipboard.writeText(content);
          setCopySuccess(documentType);
          setTimeout(() => setCopySuccess(''), 2000);
        } catch (e) {
          alert('Unable to copy to clipboard.');
        }
      };

      const handleCopyResume = () => copyToClipboard(parsed?.resumeUpdated, 'resume');
      const handleCopyCoverLetter = () => copyToClipboard(parsed?.coverLetterUpdated, 'coverLetter');
      const handleCopyAll = () => copyToClipboard(result, 'all');

      const parsed = result ? parseResults(result, analyzedResume, analyzedCoverLetter) : null;

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
          <header className="sticky top-0 z-40 bg-white/80 backdrop-blur-md shadow-sm border-b border-slate-200">
            <div className="max-w-6xl mx-auto px-4 py-5">
              <div className="flex items-center gap-4">
                <div className="p-2.5 bg-gradient-to-br from-blue-500 via-indigo-500 to-purple-600 rounded-xl shadow-lg">
                  <Sparkles className="w-7 h-7 text-white" />

            {loading && (

              <p className="text-slate-400">Powered by Claude AI</p>

        </div>

    root.render(<ResumeReviewApp />);
  </script>
