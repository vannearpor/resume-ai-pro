    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // =============================================================================
        // CONFIGURATION
        // =============================================================================
        const BACKEND_API_URL = 'https://resume-ai-backend-sigma-wheat.vercel.app/api';
        // =============================================================================
        
        // Lucide Icons
        const Upload = (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>;
        const FileText = (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>;

        const Sparkles = (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>;
        const Download = (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>;
        const AlertCircle = (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>;
        const X = (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;
        const File = (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>;
        const MessageSquare = (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>;
        const Copy = (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>;
        const Check = (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polyline points="20 6 9 17 4 12"/></svg>;
        const CreditCard = (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>;

        function ResumeReviewApp() {
            const [resume, setResume] = useState('');
            const [coverLetter, setCoverLetter] = useState('');
            const [jobDescription, setJobDescription] = useState('');
            const [additionalInstructions, setAdditionalInstructions] = useState('');
            const [result, setResult] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [resumeFileName, setResumeFileName] = useState('');
            const [coverLetterFileName, setCoverLetterFileName] = useState('');
            const [loadingProgress, setLoadingProgress] = useState(0);
            const [loadingStage, setLoadingStage] = useState('');
            const [activeTab, setActiveTab] = useState('resume');
            const [analyzedResume, setAnalyzedResume] = useState(false);
            const [analyzedCoverLetter, setAnalyzedCoverLetter] = useState(false);
            const resultsRef = useRef(null);
            
            // Payment state
            const [showPaymentModal, setShowPaymentModal] = useState(false);
            const [paymentProcessing, setPaymentProcessing] = useState(false);
            const [pendingAnalysis, setPendingAnalysis] = useState(null);

            // Check for payment completion on component mount
            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const sessionId = urlParams.get('session_id');
                
                if (sessionId) {
                    verifyPaymentAndAnalyze(sessionId);
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            }, []);

            // Verify payment with backend and proceed with analysis
            const verifyPaymentAndAnalyze = async (sessionId) => {
                setLoading(true);
                setLoadingProgress(30);
                setLoadingStage('Verifying payment...');
                
                try {
                    const verifyResponse = await fetch(`${BACKEND_API_URL}/verify-payment`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sessionId })
                    });
                    
                    const verifyData = await verifyResponse.json();
                    
                    if (!verifyData.paid) {
                        throw new Error('Payment verification failed. Please try again.');
                    }
                    
                    const pendingData = sessionStorage.getItem('pendingAnalysis');
                    if (!pendingData) {
                        throw new Error('Analysis data not found. Please start over.');
                    }
                    
                    const { resume: savedResume, coverLetter: savedCoverLetter, jobDescription: savedJobDescription, additionalInstructions: savedAdditionalInstructions, hasResumeForAnalysis, hasCoverLetterForAnalysis } = JSON.parse(pendingData);
                    
                    sessionStorage.removeItem('pendingAnalysis');
                    
                    await performAnalysis(savedResume, savedCoverLetter, savedJobDescription, savedAdditionalInstructions, hasResumeForAnalysis, hasCoverLetterForAnalysis);
                    
                } catch (e) {
                    setError(`Error: ${e.message}`);
                    setLoading(false);
                    setLoadingProgress(0);
                }
            };

            // Create Stripe checkout session via backend
            const initiatePayment = async () => {
                setPaymentProcessing(true);
                
                try {
                    const response = await fetch(`${BACKEND_API_URL}/create-checkout`, {
                        method: 'POST',
                        mode: 'cors',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({
                            successUrl: window.location.href.split('?')[0],
                            cancelUrl: window.location.href.split('?')[0]
                        })
                    });
                    
                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.error || `HTTP ${response.status}: ${response.statusText}`);
                    }
                    
                    const data = await response.json();
                    
                    if (data.url) {
                        sessionStorage.setItem('pendingAnalysis', JSON.stringify(pendingAnalysis));
                        window.location.href = data.url;
                    } else {
                        throw new Error(data.error || 'Failed to create payment session');
                    }
                } catch (e) {
                    console.error('Payment error:', e);
                    setError(`Payment Error: ${e.message}`);
                    setPaymentProcessing(false);
                    setShowPaymentModal(false);
                    setLoading(false);
                }
            };

            const parseResults = (text, hasResume, hasCoverLetter) => {
                const sections = { resumeAnalysis: '', resumeRecommendations: '', resumeUpdated: '', coverLetterAnalysis: '', coverLetterRecommendations: '', coverLetterUpdated: '' };
                
                if (hasResume && !hasCoverLetter) {
                    const resumeSections = extractSectionsFromContent(text, 'Resume');
                    sections.resumeAnalysis = resumeSections.analysis;
                    sections.resumeRecommendations = resumeSections.recommendations;
                    sections.resumeUpdated = resumeSections.updated;
                    return sections;
                }
                
                if (hasCoverLetter && !hasResume) {
                    const coverLetterSections = extractSectionsFromContent(text, 'Cover Letter');
                    sections.coverLetterAnalysis = coverLetterSections.analysis;
                    sections.coverLetterRecommendations = coverLetterSections.recommendations;
                    sections.coverLetterUpdated = coverLetterSections.updated;
                    return sections;
                }
                
                let resumeText = '';
                let coverLetterText = '';
                
                const splitPatterns = [
                    /\n#{1,3}\s*COVER\s*LETTER[^\n]*/i,
                    /\nCOVER\s*LETTER\s*(?:ANALYSIS|REVIEW|OUTPUT|SECTION)/i,
                    /\n\*\*COVER\s*LETTER[^\n]*/i,
                    /\n---+\s*\n\s*(?:#{1,3}\s*)?COVER\s*LETTER/i,
                    /\nOutput\s*(?:for\s*)?Cover\s*Letter/i
                ];
                
                let splitFound = false;
                for (const pattern of splitPatterns) {
                    if (pattern.test(text)) {
                        const parts = text.split(pattern);
                        resumeText = parts[0];
                        coverLetterText = parts.slice(1).join('');
                        splitFound = true;
                        break;
                    }
                }
                
                if (!splitFound) {
                    resumeText = text;
                }
                
                if (resumeText) {
                    const resumeSections = extractSectionsFromContent(resumeText, 'Resume');
                    sections.resumeAnalysis = resumeSections.analysis;
                    sections.resumeRecommendations = resumeSections.recommendations;
                    sections.resumeUpdated = resumeSections.updated;
                }
                
                if (coverLetterText) {
                    const coverLetterSections = extractSectionsFromContent(coverLetterText, 'Cover Letter');
                    sections.coverLetterAnalysis = coverLetterSections.analysis;
                    sections.coverLetterRecommendations = coverLetterSections.recommendations;
                    sections.coverLetterUpdated = coverLetterSections.updated;
                }
                
                return sections;
            };
            
            const extractSectionsFromContent = (content, docType) => {
                let analysis = '';
                let recommendations = '';
                let updated = '';
                
                const analysisPatterns = [
                    /#{1,3}\s*1[.\s:)]*\s*Analysis[^\n]*\n([\s\S]*?)(?=\n#{1,3}\s*2[.\s:)]*\s*(?:Specific\s*)?Recommend)/i,
                    /#{1,3}\s*1[.\s:)]*[^\n]*(?:Strength|Analysis|Improvement)[^\n]*\n([\s\S]*?)(?=\n#{1,3}\s*2[.\s:)]*)/i,
                    /#{1,3}\s*(?:Analysis|Strengths)[^\n]*\n([\s\S]*?)(?=\n#{1,3}\s*(?:Specific\s*)?Recommend)/i,
                ];
                
                const recommendationsPatterns = [
                    /#{1,3}\s*2[.\s:)]*\s*(?:Specific\s*)?Recommend[^\n]*\n([\s\S]*?)(?=\n#{1,3}\s*3[.\s:)]*\s*(?:Updated|Revised))/i,
                    /#{1,3}\s*2[.\s:)]*[^\n]*\n([\s\S]*?)(?=\n#{1,3}\s*3[.\s:)]*)/i,
                    /#{1,3}\s*(?:Specific\s*)?Recommend[^\n]*\n([\s\S]*?)(?=\n#{1,3}\s*(?:Updated|Revised))/i,
                ];
                
                const updatedPatterns = [
                    /#{1,3}\s*3[.\s:)]*\s*(?:Updated|Revised)\s*(?:Resume|Cover\s*Letter)?[^\n]*\n([\s\S]*?)$/i,
                    /#{1,3}\s*3[.\s:)]*[^\n]*\n([\s\S]*?)$/i,
                    /#{1,3}\s*(?:Updated|Revised)\s*(?:Resume|Cover\s*Letter)[^\n]*\n([\s\S]*?)$/i,
                ];
                
                for (const pattern of analysisPatterns) {
                    const match = content.match(pattern);
                    if (match && match[1]?.trim()) {
                        analysis = match[1].trim();
                        break;
                    }
                }
                
                for (const pattern of recommendationsPatterns) {
                    const match = content.match(pattern);
                    if (match && match[1]?.trim()) {
                        recommendations = match[1].trim();
                        break;
                    }
                }
                
                for (const pattern of updatedPatterns) {
                    const match = content.match(pattern);
                    if (match && match[1]?.trim()) {
                        updated = match[1].trim();
                        break;
                    }
                }
                
                if (!analysis || !recommendations || !updated) {
                    const section1Match = content.match(/#{1,3}\s*1[.\s:)]/i);
                    const section2Match = content.match(/#{1,3}\s*2[.\s:)]/i);
                    const section3Match = content.match(/#{1,3}\s*3[.\s:)]/i);
                    
                    if (section1Match && section2Match && section3Match) {
                        const s1Index = content.indexOf(section1Match[0]);
                        const s2Index = content.indexOf(section2Match[0]);
                        const s3Index = content.indexOf(section3Match[0]);
                        
                        if (s1Index < s2Index && s2Index < s3Index) {
                            const s1Content = content.substring(s1Index, s2Index);
                            const s2Content = content.substring(s2Index, s3Index);
                            const s3Content = content.substring(s3Index);
                            
                            if (!analysis) analysis = s1Content.replace(/^[^\n]*\n/, '').trim();
                            if (!recommendations) recommendations = s2Content.replace(/^[^\n]*\n/, '').trim();
                            if (!updated) updated = s3Content.replace(/^[^\n]*\n/, '').trim();
                        }
                    }
                }
                
                return { analysis, recommendations, updated };
            };

            const handleFileRead = async (file) => {
                if (file.type === 'application/pdf') {
                    const ab = await file.arrayBuffer();
                    const u8 = new Uint8Array(ab);
                    let b64 = '';
                    for (let i = 0; i < u8.length; i++) {
                        b64 += String.fromCharCode(u8[i]);
                    }
                    b64 = btoa(b64);
                    const res = await fetch(`${BACKEND_API_URL}/extract-pdf`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ data: b64 })
                    });
                    const data = await res.json();
                    if (data.error) throw new Error('Failed to read PDF');
                    return data.text;
                } else if (file.name.endsWith('.docx')) {
                    const ab = await file.arrayBuffer();
                    const r = await mammoth.extractRawText({ arrayBuffer: ab });
                    if (!r.value?.trim()) throw new Error('Failed to read DOCX');
                    return r.value;
                } else if (file.name.endsWith('.doc')) {
                    throw new Error('DOC format not supported. Please convert to DOCX or PDF.');
                }
                return await file.text();
            };

            const handleFile = async (file, type) => {
                if (!file) return;
                try {
                    const text = await handleFileRead(file);
                    if (type === 'resume') { setResume(text); setResumeFileName(file.name); }
                    else { setCoverLetter(text); setCoverLetterFileName(file.name); }
                    setError('');
                } catch (e) {
                    setError(`Error: ${e.message}`);
                }
            };

            const analyze = async () => {
                if (!resume && !coverLetter) { setError('Provide at least resume or cover letter'); return; }
                setLoading(true);
                setError('');
                setResult(null);
                setLoadingProgress(0);
                setLoadingStage('Preparing documents...');
                setActiveTab('resume');
                
                const hasResumeForAnalysis = !!resume;
                const hasCoverLetterForAnalysis = !!coverLetter;
                
                setPendingAnalysis({
                    resume,
                    coverLetter,
                    jobDescription,
                    additionalInstructions,
                    hasResumeForAnalysis,
                    hasCoverLetterForAnalysis
                });
                
                let currentProgress = 0;
                const progressInterval = setInterval(() => {
                    currentProgress += 5;
                    setLoadingProgress(currentProgress);
                    
                    if (currentProgress >= 30) {
                        clearInterval(progressInterval);
                        setLoadingStage('Documents analyzed!');
                        setShowPaymentModal(true);
                    }
                }, 400);

                setLoadingStage('Reading and analyzing documents...');
            };

            const performAnalysis = async (analyzeResume, analyzeCoverLetter, analyzeJobDescription, analyzeAdditionalInstructions, hasResumeForAnalysis, hasCoverLetterForAnalysis) => {
                try {
                    setShowPaymentModal(false);
                    setLoadingProgress(35);
                    setLoadingStage('Payment verified! Analyzing documents...');

                    const prompt = `You are an expert career coach, resume writer, and cover letter writer known for making TRANSFORMATIVE improvements to documents.

Analyze the provided documents and generate outputs only for the document types supplied (resume and/or cover letter). The inputs may include:      
- A resume      
- A cover letter      
- A job description      
- Additional Instructions provided by the user

Outputs (Required)  
For each document type provided, produce exactly two outputs in the following order:

Output 1: Analysis & Recommendations      
- A bulleted list with detailed analysis of strengths and areas for improvement      
- A bulleted list with specific, actionable recommendations ${analyzeJobDescription ? 'for tailoring to this job' : 'for improving the document'}      
- Focus on clarity, structure, keyword alignment, ATS compatibility, and impact      
- Explicitly call out where content is vague, overly wordy, repetitive, or lacking clarity      
- Identify weak action verbs that should be replaced with stronger alternatives
- Note any formatting, ordering, or structural improvements needed
- Reference relevant feedback driven by the job description and/or additional instructions where applicable

Output 2: Updated Document (COMPREHENSIVE REWRITE)
CRITICAL: The updated document must show VISIBLE, SUBSTANTIAL improvements. Users are paying for meaningful optimization, not minor tweaks.

You MUST apply ALL of the following transformations:

1. ACTION VERB TRANSFORMATION: Replace EVERY weak or passive verb with powerful, dynamic alternatives
   - "Responsible for" -> "Spearheaded", "Orchestrated", "Drove"
   - "Helped" -> "Enabled", "Facilitated", "Empowered"  
   - "Worked on" -> "Engineered", "Developed", "Executed"
   - "Did" -> "Delivered", "Achieved", "Accomplished"
   - "Made" -> "Created", "Built", "Designed"
   - "Managed" -> "Directed", "Led", "Oversaw"

2. SENTENCE STRUCTURE OPTIMIZATION: Rewrite bullets for maximum impact
   - Lead with the action verb
   - Remove filler words and redundancies
   - Combine related points for conciseness
   - Break up overly long bullets into focused statements

3. PROFESSIONAL LANGUAGE UPGRADE: Elevate the vocabulary throughout
   - Replace casual language with professional terminology
   - Use industry-standard keywords naturally
   - Ensure consistent tone and voice

4. FORMATTING & ORGANIZATION: Improve visual hierarchy and flow
   - Reorder bullets to lead with strongest achievements
   - Group related experiences logically
   - Ensure parallel structure across all bullets

5. CLARITY & CONCISENESS: Tighten all writing
   - Remove unnecessary words
   - Eliminate redundant phrases
   - Make every word count

6. ATS OPTIMIZATION: Enhance keyword density naturally
   - Incorporate relevant keywords from job description (if provided)
   - Use standard section headings
   - Avoid graphics-dependent formatting descriptions

The updated document should be NOTICEABLY different and improved from the original. A side-by-side comparison should clearly show the value of the optimization.

Accuracy & Data Integrity Constraints      
- You must NOT invent new facts, metrics, numbers, outcomes, tools, company names, or achievements
- You must ONLY use information explicitly present in the provided documents
- Do NOT add quantitative data unless it exists in the source
- You CAN and SHOULD:
  - Rephrase and restructure existing content dramatically
  - Replace weak verbs with strong action verbs
  - Reorder content for better impact
  - Improve word choice and professional tone
  - Add industry keywords that accurately describe existing experience
  - Combine or split bullets for better readability

Job Description Alignment (If Provided)      
- Actively incorporate relevant terminology and keywords from the job description
- Reorder and emphasize experiences that align with job requirements
- Mirror the language and priorities of the posting where it accurately reflects existing experience

Additional Instructions Handling (If Provided)     
- Treat the Additional Instructions as authoritative user guidance      
- Apply tone, emphasis, formatting, or customization requests fully

${analyzeResume ? `RESUME:\n${analyzeResume}\n\n` : ''}${analyzeCoverLetter ? `COVER LETTER:\n${analyzeCoverLetter}\n\n` : ''}${analyzeJobDescription ? `JOB DESCRIPTION:\n${analyzeJobDescription}\n\n` : ''}${analyzeAdditionalInstructions ? `ADDITIONAL INSTRUCTIONS:\n${analyzeAdditionalInstructions}\n\n` : ''}FORMAT YOUR RESPONSE EXACTLY AS FOLLOWS for each document type:

# RESUME (if provided)

## 1. Analysis: Strengths and Areas for Improvement

### Strengths
- [bullet points for strengths]

### Areas for Improvement
- [bullet points for areas needing improvement]

## 2. Specific Recommendations
- [bullet points with specific, actionable recommendations]

## 3. Updated Resume
[The complete rewritten resume content]

---

# COVER LETTER (if provided)

## 1. Analysis: Strengths and Areas for Improvement

### Strengths
- [bullet points for strengths]

### Areas for Improvement
- [bullet points for areas needing improvement]

## 2. Specific Recommendations
- [bullet points with specific, actionable recommendations]

## 3. Updated Cover Letter
[The complete rewritten cover letter content]

CRITICAL FORMATTING RULES:
- Use EXACTLY the headers shown above (## 1., ## 2., ## 3.)
- Include BOTH "### Strengths" and "### Areas for Improvement" subheaders
- Keep each section's content ONLY under its designated header
- Do NOT mix content between sections
- Complete ALL sections fully before moving to the next document type`;

                    setLoadingProgress(40);
                    setLoadingStage('Analyzing and optimizing content...');

                    let apiProgressInterval = setInterval(() => {
                        setLoadingProgress(prev => {
                            if (prev >= 85) return prev;
                            const increment = prev < 70 ? 2 : 1;
                            return prev + increment;
                        });
                    }, 3000);

                    const res = await fetch(`${BACKEND_API_URL}/analyze`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt })
                    });
                    
                    clearInterval(apiProgressInterval);
                    setLoadingStage('Processing recommendations...');
                    setLoadingProgress(88);
                    
                    const data = await res.json();
                    if (data.error) throw new Error(data.error.message || data.error);

                                                        <h3 className="text-xl font-bold text-slate-700 mb-3">No Resume Analyzed</h3>
                                                        <p className="text-slate-500">Upload or paste your resume and run the analysis again.</p>
                                                    </div>
                                                ) : (
                                                    <>
                                                        {(parsed.resumeAnalysis || parsed.resumeRecommendations) && (
                                                            <div className="bg-gradient-to-br from-blue-50 via-indigo-50 to-blue-50 rounded-2xl p-8 border border-blue-200/60">
                                                                <h3 className="text-xl font-bold mb-6 text-slate-800 flex items-center gap-3">
                                                                    <div className="p-2 bg-gradient-to-br from-blue-500 to-indigo-500 rounded-lg">
                                                                        <Sparkles className="w-5 h-5 text-white" />
                                                                    </div>
                                                                    Analysis & Recommendations
                                                                </h3>
                                                                {parsed.resumeAnalysis && (
                                                                    <div className="mb-6">
                                                                        <h4 className="font-semibold mb-3 text-slate-700">Strengths and Areas for Improvement</h4>
                                                                        <div className="bg-white p-6 rounded-xl border border-blue-100 shadow-sm">{formatContent(parsed.resumeAnalysis)}</div>
                                                                    </div>
                                                                )}
                                                                {parsed.resumeRecommendations && (
                                                                    <div>
                                                                        <h4 className="font-semibold mb-3 text-slate-700">Specific Recommendations</h4>
                                                                        <div className="bg-white p-6 rounded-xl border border-blue-100 shadow-sm">{formatContent(parsed.resumeRecommendations)}</div>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        )}
                                                        {parsed.resumeUpdated && (
                                                            <div className="bg-gradient-to-br from-emerald-50 via-green-50 to-emerald-50 rounded-2xl p-8 border border-emerald-200/60">
                                                                <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
                                                                    <h3 className="text-xl font-bold text-slate-800 flex items-center gap-3">
                                                                        <div className="p-2 bg-gradient-to-br from-emerald-500 to-green-500 rounded-lg">
                                                                            <FileText className="w-5 h-5 text-white" />
                                                                        </div>
                                                                        Updated Resume
                                                                    </h3>
                                                                    <div className="flex items-center gap-2">
                                                                        <button onClick={handleCopyResume} className="flex items-center gap-2 px-4 py-2 bg-white border border-emerald-300 text-emerald-700 rounded-lg font-semibold hover:bg-emerald-50 transition-all shadow-sm text-sm">
                                                                            {copySuccess === 'resume' ? <Check className="w-4 h-4" /> : <Copy className="w-4 h-4" />}
                                                                            {copySuccess === 'resume' ? 'Copied!' : 'Copy'}
                                                                        </button>
                                                                        <button onClick={handleDownloadResume} className="flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-emerald-500 to-green-500 text-white rounded-lg font-semibold hover:from-emerald-600 hover:to-green-600 transition-all shadow-md text-sm">
                                                                            <Download className="w-4 h-4" />Download
                                                                        </button>
                                                                    </div>
                                                                </div>
                                                                <div className="bg-white p-6 rounded-xl border border-emerald-100 shadow-sm">
                                                                    {formatContent(parsed.resumeUpdated)}
                                                                </div>
                                                            </div>
                                                        )}
                                                    </>
                                                )}
                                            </div>
                                        )}

                                        {activeTab === 'coverLetter' && (
                                            <div className="space-y-8">
                                                {!analyzedCoverLetter ? (
                                                    <div className="bg-gradient-to-br from-purple-50 via-pink-50 to-purple-50 border border-purple-200/60 rounded-2xl p-10 text-center">
                                                        <FileText className="w-10 h-10 text-purple-400 mx-auto mb-5" />
                                                        <h3 className="text-xl font-bold text-slate-700 mb-3">No Cover Letter Analyzed</h3>
                                                        <p className="text-slate-500">Upload or paste your cover letter and run the analysis again.</p>
                                                    </div>
                                                ) : (
                                                    <>
                                                        {(parsed.coverLetterAnalysis || parsed.coverLetterRecommendations) && (
                                                            <div className="bg-gradient-to-br from-purple-50 via-pink-50 to-purple-50 rounded-2xl p-8 border border-purple-200/60">
                                                                <h3 className="text-xl font-bold mb-6 text-slate-800 flex items-center gap-3">
                                                                    <div className="p-2 bg-gradient-to-br from-purple-500 to-pink-500 rounded-lg">
                                                                        <Sparkles className="w-5 h-5 text-white" />
                                                                    </div>
                                                                    Analysis & Recommendations
                                                                </h3>
                                                                {parsed.coverLetterAnalysis && (
                                                                    <div className="mb-6">
                                                                        <h4 className="font-semibold mb-3 text-slate-700">Strengths and Areas for Improvement</h4>
                                                                        <div className="bg-white p-6 rounded-xl border border-purple-100 shadow-sm">{formatContent(parsed.coverLetterAnalysis)}</div>
                                                                    </div>
                                                                )}
                                                                {parsed.coverLetterRecommendations && (
                                                                    <div>
                                                                        <h4 className="font-semibold mb-3 text-slate-700">Specific Recommendations</h4>
                                                                        <div className="bg-white p-6 rounded-xl border border-purple-100 shadow-sm">{formatContent(parsed.coverLetterRecommendations)}</div>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        )}
                                                        {parsed.coverLetterUpdated && (
                                                            <div className="bg-gradient-to-br from-emerald-50 via-green-50 to-emerald-50 rounded-2xl p-8 border border-emerald-200/60">
                                                                <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
                                                                    <h3 className="text-xl font-bold text-slate-800 flex items-center gap-3">
                                                                        <div className="p-2 bg-gradient-to-br from-emerald-500 to-green-500 rounded-lg">
                                                                            <FileText className="w-5 h-5 text-white" />
                                                                        </div>
                                                                        Updated Cover Letter
                                                                    </h3>
                                                                    <div className="flex items-center gap-2">
                                                                        <button onClick={handleCopyCoverLetter} className="flex items-center gap-2 px-4 py-2 bg-white border border-emerald-300 text-emerald-700 rounded-lg font-semibold hover:bg-emerald-50 transition-all shadow-sm text-sm">
                                                                            {copySuccess === 'coverLetter' ? <Check className="w-4 h-4" /> : <Copy className="w-4 h-4" />}
                                                                            {copySuccess === 'coverLetter' ? 'Copied!' : 'Copy'}
                                                                        </button>
                                                                        <button onClick={handleDownloadCoverLetter} className="flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-emerald-500 to-green-500 text-white rounded-lg font-semibold hover:from-emerald-600 hover:to-green-600 transition-all shadow-md text-sm">
                                                                            <Download className="w-4 h-4" />Download
                                                                        </button>
                                                                    </div>
                                                                </div>
                                                                <div className="bg-white p-6 rounded-xl border border-emerald-100 shadow-sm">{formatContent(parsed.coverLetterUpdated)}</div>
                                                            </div>
                                                        )}
                                                    </>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="bg-gradient-to-r from-slate-800 via-slate-900 to-slate-800 mt-16">
                        <div className="max-w-6xl mx-auto px-4 py-10 text-center">
                            <div className="flex items-center justify-center gap-3 mb-4">
                                <div className="p-2 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-lg">
                                    <Sparkles className="w-5 h-5 text-white" />
                                </div>
                                <span className="text-white font-bold text-lg">Resume AI Pro</span>
                            </div>
                            <p className="text-slate-400">Powered by Claude AI</p>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ResumeReviewApp />);
    </script>
</body>
</html>
