  <script>
    // ============================================================

    var ANTHROPIC_API_KEY = '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';
    // ============================================================

    function showError(msg, detail) {
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('root').style.display = 'none';
      document.getElementById('error-screen').style.display = 'flex';
      document.getElementById('error-msg').textContent = msg;
      document.getElementById('error-detail').textContent = detail || '';

    window.onerror = function(m,u,l,c,e) { showError('JavaScript Error', m + '\nLine: ' + l); return false; };

    // Wait for all scripts to load
    window.addEventListener('load', function() {
      setTimeout(function() {
        document.getElementById('load-status').textContent = 'Initializing...';

        if (typeof React === 'undefined') { 
          showError('React failed to load', 'The React library could not be loaded from CDN.\n\nPossible causes:\n- Ad blocker or privacy extension blocking scripts\n- Network/firewall blocking CDN domains\n- Corporate proxy blocking external scripts\n\nTry:\n1. Disable ad blockers for this site\n2. Try a different browser\n3. Check browser console (F12) for errors'); 
          return; 
        }
        if (typeof ReactDOM === 'undefined') { 
          showError('ReactDOM failed to load', 'Check network connection and ad blockers'); 
          return; 
        }

          console.warn('Lucide icons not loaded, using fallback');

            createIcons: function(){},

          strokeLinecap: 'round',
          strokeLinejoin: 'round',
          className: props.className || ''

    function initApp() {
      var h = React.createElement, useState = React.useState, useRef = React.useRef;

      function App() {
        var s = function(init) { return useState(init); };

        var result = s(null), loading = s(false), error = s('');

        var progress = s(0), stage = s(''), tab = s('resume');
        var didResume = s(false), didCover = s(false), copyOK = s('');
        var resultsRef = useRef(null);

        function parseResult(text, hasR, hasC) {
          var sec = {rA:'',rR:'',rU:'',cA:'',cR:'',cU:''};
          function extract(c) {
            var a='',r='',u='';
            var m1 = c.match(/##\s*1[.\s:)][^\n]*\n([\s\S]*?)(?=\n##\s*2)/i);
            if(m1) a = m1[1].trim();
            var m2 = c.match(/##\s*2[.\s:)][^\n]*\n([\s\S]*?)(?=\n##\s*3)/i);
            if(m2) r = m2[1].trim();
            var m3 = c.match(/##\s*3[.\s:)][^\n]*\n([\s\S]*?)$/i);
            if(m3) u = m3[1].trim();
            return {a:a,r:r,u:u};
          }
          if(hasR && !hasC) { var x=extract(text); sec.rA=x.a; sec.rR=x.r; sec.rU=x.u; return sec; }
          if(hasC && !hasR) { var x=extract(text); sec.cA=x.a; sec.cR=x.r; sec.cU=x.u; return sec; }
          var split = text.split(/\n#{1,3}\s*COVER\s*LETTER/i);
          if(split.length > 1) {
            var xr=extract(split[0]); sec.rA=xr.a; sec.rR=xr.r; sec.rU=xr.u;
            var xc=extract(split.slice(1).join('')); sec.cA=xc.a; sec.cR=xc.r; sec.cU=xc.u;
          } else { var xr=extract(text); sec.rA=xr.a; sec.rR=xr.r; sec.rU=xr.u; }
          return sec;
        }

        function readFile(file) {
          return new Promise(function(ok, fail) {
            if(file.type === 'application/pdf' || file.name.endsWith('.doc')) {
              file.arrayBuffer().then(function(ab) {
                var u8 = new Uint8Array(ab), bin = '';
                for(var i=0;i<u8.length;i++) bin += String.fromCharCode(u8[i]);
                fetch('https://api.anthropic.com/v1/messages', {
                  method: 'POST',
                  headers: {'Content-Type':'application/json','x-api-key':ANTHROPIC_API_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
                  body: JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,messages:[{role:'user',content:[{type:'document',source:{type:'base64',media_type:file.type||'application/msword',data:btoa(bin)}},{type:'text',text:'Extract all text.'}]}]})
                }).then(function(r){return r.json();}).then(function(d){
                  if(d.error) fail(new Error(d.error.message||JSON.stringify(d.error)));
                  else ok(d.content.filter(function(x){return x.type==='text';}).map(function(x){return x.text;}).join('\n'));
                }).catch(fail);
              }).catch(fail);
            } else if(file.name.endsWith('.docx')) {
              if(typeof mammoth === 'undefined') { fail(new Error('DOCX support not loaded. Please use PDF or TXT.')); return; }
              file.arrayBuffer().then(function(ab) {
                mammoth.extractRawText({arrayBuffer:ab}).then(function(r){
                  if(!r.value) fail(new Error('Empty DOCX')); else ok(r.value);
                }).catch(fail);
              }).catch(fail);
            } else { file.text().then(ok).catch(fail); }
          });
        }

        function handleFile(file, type) {
          if(!file) return;
          readFile(file).then(function(txt) {
            if(type==='r') { resume[1](txt); resumeFN[1](file.name); }
            else { coverLetter[1](txt); coverFN[1](file.name); }
            error[1]('');
          }).catch(function(e) { error[1]('File error: ' + e.message); });
        }

        function analyze() {
          if(!resume[0] && !coverLetter[0]) { error[1]('Please provide a resume or cover letter'); return; }
          if(ANTHROPIC_API_KEY === 'your-api-key-here') { error[1]('Please add your API key. Edit the HTML file and replace "your-api-key-here" with your actual Anthropic API key.'); return; }
          loading[1](true); error[1](''); result[1](null); progress[1](0); stage[1]('Preparing...'); tab[1]('resume');
          var hasR = !!resume[0], hasC = !!coverLetter[0];

          var intv = setInterval(function() { progress[1](function(p) { if(p>=30){clearInterval(intv);return p;} return p+5; }); }, 400);
          stage[1]('Analyzing...');

          setTimeout(function() {
            var prompt = 'You are an expert resume writer. Analyze and optimize the documents.\n\nFor each document, output:\n## 1. Analysis\n### Strengths\n- bullets\n### Areas for Improvement\n- bullets\n## 2. Recommendations\n- bullets\n## 3. Updated Document\n[full rewrite]\n\nReplace weak verbs, add impact, optimize for ATS. Do NOT invent facts.\n\n';
            if(resume[0]) prompt += 'RESUME:\n' + resume[0] + '\n\n';
            if(coverLetter[0]) prompt += 'COVER LETTER:\n' + coverLetter[0] + '\n\n';
            if(jobDesc[0]) prompt += 'JOB DESCRIPTION:\n' + jobDesc[0] + '\n\n';
            if(addInstr[0]) prompt += 'INSTRUCTIONS:\n' + addInstr[0] + '\n\n';

            clearInterval(intv); progress[1](40); stage[1]('Processing...');
            var intv2 = setInterval(function() { progress[1](function(p) { if(p>=85) return p; return p + (p<70?2:1); }); }, 3000);

            fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: {'Content-Type':'application/json','x-api-key':ANTHROPIC_API_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
              body: JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:8000,messages:[{role:'user',content:prompt}]})
            }).then(function(r){return r.json();}).then(function(data) {
              clearInterval(intv2); progress[1](95); stage[1]('Finalizing...');
              if(data.error) {
                var msg = data.error.message || JSON.stringify(data.error);
                if(msg.indexOf('browser')>-1 || msg.indexOf('CORS')>-1 || msg.indexOf('forbidden')>-1) {
                  msg += '\n\n🔧 TO FIX THIS:\n1. Go to console.anthropic.com\n2. Click on your API key\n3. Enable "Allow direct browser access"\n4. Add your domain to "Allowed origins"';
                }
                throw new Error(msg);
              }
              var txt = data.content.filter(function(x){return x.type==='text';}).map(function(x){return x.text;}).join('\n');
              progress[1](100);
              result[1](txt); didResume[1](hasR); didCover[1](hasC);
              setTimeout(function() { if(resultsRef.current) resultsRef.current.scrollIntoView({behavior:'smooth'}); }, 100);
            }).catch(function(e) { error[1]('Error: ' + e.message); }).finally(function() { loading[1](false); progress[1](0); });
          }, 800);
        }

        function formatText(txt) {
          if(!txt) return null;
          var lines = txt.split('\n'), elems = [], list = [];
          lines.forEach(function(ln, i) {
            var t = ln.trim();
            if(!t) { if(list.length) { elems.push(h('ul',{key:'l'+elems.length,className:'list-disc ml-6 mb-4 text-slate-600'},list)); list=[]; } return; }
            var bm = t.match(/^[-*•]\s+(.+)$/);
            if(bm) { list.push(h('li',{key:'i'+i,className:'mb-1'},bm[1])); }
            else if(t.startsWith('##') || t.match(/^\*\*.+\*\*$/)) {
              if(list.length) { elems.push(h('ul',{key:'l'+elems.length,className:'list-disc ml-6 mb-4 text-slate-600'},list)); list=[]; }
              elems.push(h('h5',{key:'h'+i,className:'font-bold text-slate-800 mt-4 mb-2'},t.replace(/^#+\s*/,'').replace(/\*\*/g,'')));
            } else {
              if(list.length) { elems.push(h('ul',{key:'l'+elems.length,className:'list-disc ml-6 mb-4 text-slate-600'},list)); list=[]; }
              elems.push(h('p',{key:'p'+i,className:'text-slate-600 mb-2'},t));
            }
          });
          if(list.length) elems.push(h('ul',{key:'l'+elems.length,className:'list-disc ml-6 mb-4 text-slate-600'},list));
          return h('div',null,elems);
        }

        function download(content, name) {
          if(!content) { alert('Nothing to download'); return; }
          try {
            var blob = new Blob([content],{type:'text/plain'}), url = URL.createObjectURL(blob);
            var a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
            setTimeout(function() { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
          } catch(e) {
            navigator.clipboard.writeText(content).then(function() { alert('Copied to clipboard instead'); }).catch(function() { alert('Download failed'); });
          }
        }

        function copy(content, type) {
          if(!content) return;
          navigator.clipboard.writeText(content).then(function() { copyOK[1](type); setTimeout(function(){copyOK[1]('');},2000); }).catch(function(){alert('Copy failed');});
        }

        var parsed = result[0] ? parseResult(result[0], didResume[0], didCover[0]) : null;

        // Build UI
        return h('div', {className:'min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50'},
          // Header
          h('header', {className:'sticky top-0 z-40 bg-white/80 backdrop-blur-md shadow-sm border-b border-slate-200'},
            h('div', {className:'max-w-6xl mx-auto px-4 py-5'},
              h('div', {className:'flex items-center gap-4'},
                h('div', {className:'p-2.5 bg-gradient-to-br from-blue-500 via-indigo-500 to-purple-600 rounded-xl shadow-lg'},

          // Main

            // Upload grid
            h('div', {className:'grid md:grid-cols-2 gap-6 mb-8'},
              // Resume

                h('h2', {className:'text-xl font-bold mb-4 flex items-center gap-3 text-slate-800'},

                    onDragOver:function(e){e.preventDefault();}, onDrop:function(e){e.preventDefault();handleFile(e.dataTransfer.files[0],'r');}},
                    h('div', {className:'p-2 bg-slate-100 rounded-full w-fit mx-auto mb-2'}, h(Icons.Upload, {className:'w-5 h-5 text-slate-500'})),
                    h('p', {className:'text-sm text-slate-600'}, 'Drag & drop or click'),

                    h('input', {type:'file', accept:'.txt,.doc,.docx,.pdf', className:'hidden', onChange:function(e){handleFile(e.target.files[0],'r');e.target.value='';}})
                  )

                    h('button', {onClick:function(){resume[1]('');resumeFN[1]('');}, className:'p-1 hover:bg-blue-100 rounded'}, h(Icons.X, {className:'w-4 h-4 text-slate-400'}))
                  ) :
                  h('textarea', {value:resume[0], onChange:function(e){resume[1](e.target.value);}, placeholder:'Or paste resume text...', className:'w-full mt-4 p-3 border border-slate-200 rounded-xl resize-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 outline-none text-slate-700', rows:5})
              ),
              // Cover Letter
              h('div', {className:'bg-white rounded-2xl shadow-md p-6 border border-slate-200/60'},
                h('h2', {className:'text-xl font-bold mb-4 flex items-center gap-3 text-slate-800'},
                  h('div', {className:'p-2 bg-purple-100 rounded-lg'}, h(Icons.FileText, {className:'w-5 h-5 text-purple-600'})),
                  'Cover Letter'
                ),
                h('label', null,
                  h('div', {className:'border-2 border-dashed border-slate-300 rounded-xl p-6 text-center cursor-pointer hover:border-purple-400 hover:bg-purple-50/50 transition-all',

                    h('div', {className:'p-2 bg-slate-100 rounded-full w-fit mx-auto mb-2'}, h(Icons.Upload, {className:'w-5 h-5 text-slate-500'})),
                    h('p', {className:'text-sm text-slate-600'}, 'Drag & drop or click'),
                    h('p', {className:'text-xs text-slate-400'}, 'PDF, DOC, DOCX, TXT'),
                    h('input', {type:'file', accept:'.txt,.doc,.docx,.pdf', className:'hidden', onChange:function(e){handleFile(e.target.files[0],'c');e.target.value='';}})
                  )
                ),
                coverFN[0] ?
                  h('div', {className:'mt-4 p-3 bg-purple-50 border border-purple-200 rounded-lg flex items-center justify-between'},
                    h('div', {className:'flex items-center gap-2'},
                      h(Icons.File, {className:'w-4 h-4 text-purple-600'}),
                      h('span', {className:'text-sm font-medium text-slate-700'}, coverFN[0])
                    ),
                    h('button', {onClick:function(){coverLetter[1]('');coverFN[1]('');}, className:'p-1 hover:bg-purple-100 rounded'}, h(Icons.X, {className:'w-4 h-4 text-slate-400'}))
                  ) :
                  h('textarea', {value:coverLetter[0], onChange:function(e){coverLetter[1](e.target.value);}, placeholder:'Or paste cover letter...', className:'w-full mt-4 p-3 border border-slate-200 rounded-xl resize-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-400 outline-none text-slate-700', rows:5})
              )
            ),

            // Job Description
            h('div', {className:'bg-white rounded-2xl shadow-md p-6 border border-slate-200/60 mb-8'},
              h('h2', {className:'text-xl font-bold mb-4 flex items-center gap-3 text-slate-800'},
                h('div', {className:'p-2 bg-green-100 rounded-lg'}, h(Icons.Briefcase, {className:'w-5 h-5 text-green-600'})),
                'Job Description ', h('span', {className:'text-slate-400 font-normal text-base'}, '(Optional)')
              ),
              h('textarea', {value:jobDesc[0], onChange:function(e){jobDesc[1](e.target.value);}, placeholder:'Paste job description to tailor your documents...', className:'w-full p-3 border border-slate-200 rounded-xl resize-none focus:ring-2 focus:ring-green-500/20 focus:border-green-400 outline-none text-slate-700', rows:6})
            ),

            // Additional Instructions
            h('div', {className:'bg-white rounded-2xl shadow-md p-6 border border-slate-200/60 mb-8'},
              h('h2', {className:'text-xl font-bold mb-4 flex items-center gap-3 text-slate-800'},
                h('div', {className:'p-2 bg-amber-100 rounded-lg'}, h(Icons.MessageSquare, {className:'w-5 h-5 text-amber-600'})),
                'Additional Instructions ', h('span', {className:'text-slate-400 font-normal text-base'}, '(Optional)')
              ),
              h('textarea', {value:addInstr[0], onChange:function(e){addInstr[1](e.target.value);}, placeholder:'Any specific preferences or instructions...', className:'w-full p-3 border border-slate-200 rounded-xl resize-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-400 outline-none text-slate-700', rows:3})
            ),

            // Loading modal
            loading[0] && h('div', {className:'fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50'},
              h('div', {className:'bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full mx-4'},
                h('div', {className:'text-center'},
                  h('div', {className:'relative w-20 h-20 mx-auto mb-6'},
                    h('div', {className:'absolute inset-0 border-4 border-slate-200 rounded-full'}),
                    h('div', {className:'absolute inset-0 border-4 border-transparent border-t-blue-500 border-r-indigo-500 rounded-full animate-spin'}),
                    h('div', {className:'absolute inset-0 flex items-center justify-center'},
                      h('div', {className:'p-2 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-xl'},
                        h(Icons.Sparkles, {className:'w-5 h-5 text-white'})
                      )
                    )
                  ),
                  h('h3', {className:'text-xl font-bold text-slate-800 mb-2'}, 'Analyzing Documents'),
                  h('p', {className:'text-slate-500 mb-6'}, stage[0]),
                  h('div', {className:'mb-4'},
                    h('div', {className:'flex justify-between text-sm mb-2'},
                      h('span', {className:'text-slate-600'}, 'Progress'),
                      h('span', {className:'font-bold text-blue-600'}, progress[0] + '%')
                    ),
                    h('div', {className:'w-full bg-slate-100 rounded-full h-2.5'},
                      h('div', {className:'bg-gradient-to-r from-blue-500 to-purple-500 h-2.5 rounded-full transition-all', style:{width:progress[0]+'%'}})
                    )
                  ),
                  h('p', {className:'text-xs text-slate-400'}, 'This may take 1-2 minutes')
                )
              )
            ),

            // Error
            error[0] && h('div', {className:'bg-red-50 border border-red-200 rounded-xl p-4 mb-6 flex items-start gap-3'},
              h(Icons.AlertCircle, {className:'w-5 h-5 text-red-600 flex-shrink-0 mt-0.5'}),
              h('p', {className:'text-red-700', style:{whiteSpace:'pre-wrap'}}, error[0])
            ),

            // Analyze button
            h('div', {className:'text-center mb-10'},
              h('button', {onClick:analyze, disabled:loading[0], className:'bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 hover:from-blue-700 hover:via-indigo-700 hover:to-purple-700 text-white px-10 py-4 rounded-xl font-bold text-lg shadow-xl hover:shadow-2xl transform hover:-translate-y-0.5 transition-all disabled:opacity-50'},
                h('span', {className:'flex items-center gap-2'},
                  loading[0] ? h('div', {className:'w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin'}) : h(Icons.Sparkles, {className:'w-5 h-5'}),
                  loading[0] ? 'Analyzing...' : 'Analyze & Optimize'
                )
              )
            ),

            // Results
            result[0] && parsed && h('div', {className:'space-y-6', ref:resultsRef},
              h('div', {className:'flex items-center justify-between bg-gradient-to-r from-slate-800 to-slate-700 rounded-t-2xl p-5 flex-wrap gap-3'},
                h('h2', {className:'text-xl font-bold text-white'}, 'Your Results'),
                h('div', {className:'flex gap-2'},
                  h('button', {onClick:function(){copy(result[0],'all');}, className:'flex items-center gap-1.5 px-3 py-2 bg-slate-600 text-white rounded-lg text-sm font-medium hover:bg-slate-500'},
                    copyOK[0]==='all' ? h(Icons.Check, {className:'w-4 h-4'}) : h(Icons.Copy, {className:'w-4 h-4'}),
                    copyOK[0]==='all' ? 'Copied!' : 'Copy All'
                  ),
                  h('button', {onClick:function(){download(result[0],'results.txt');}, className:'flex items-center gap-1.5 px-3 py-2 bg-white text-slate-800 rounded-lg text-sm font-medium hover:bg-slate-100'},
                    h(Icons.Download, {className:'w-4 h-4'}), 'Download'
                  )
                )
              ),
              h('div', {className:'bg-white rounded-b-2xl shadow-xl border border-slate-200/60'},
                h('div', {className:'flex bg-slate-100'},
                  h('button', {onClick:function(){tab[1]('resume');}, className:'flex-1 py-4 px-4 font-bold transition-all ' + (tab[0]==='resume' ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white' : 'text-slate-600 hover:bg-slate-200')},
                    'Resume Review'
                  ),
                  h('button', {onClick:function(){tab[1]('cover');}, className:'flex-1 py-4 px-4 font-bold transition-all ' + (tab[0]==='cover' ? 'bg-gradient-to-r from-purple-600 to-pink-600 text-white' : 'text-slate-600 hover:bg-slate-200')},
                    'Cover Letter Review'
                  )
                ),
                h('div', {className:'p-6'},
                  tab[0]==='resume' && (
                    !didResume[0] ?
                      h('div', {className:'bg-blue-50 rounded-xl p-8 text-center'},
                        h(Icons.FileText, {className:'w-10 h-10 text-blue-300 mx-auto mb-3'}),
                        h('p', {className:'text-slate-500'}, 'No resume was analyzed')
                      ) :
                      h('div', {className:'space-y-6'},
                        (parsed.rA || parsed.rR) && h('div', {className:'bg-blue-50 rounded-xl p-5'},
                          h('h3', {className:'font-bold text-lg mb-4 text-slate-800'}, 'Analysis & Recommendations'),
                          parsed.rA && h('div', {className:'bg-white p-4 rounded-lg mb-4'}, formatText(parsed.rA)),
                          parsed.rR && h('div', {className:'bg-white p-4 rounded-lg'}, formatText(parsed.rR))
                        ),
                        parsed.rU && h('div', {className:'bg-green-50 rounded-xl p-5'},
                          h('div', {className:'flex items-center justify-between mb-4 flex-wrap gap-2'},
                            h('h3', {className:'font-bold text-lg text-slate-800'}, 'Updated Resume'),
                            h('div', {className:'flex gap-2'},
                              h('button', {onClick:function(){copy(parsed.rU,'r');}, className:'flex items-center gap-1 px-3 py-1.5 bg-white border border-green-300 text-green-700 rounded-lg text-sm font-medium hover:bg-green-50'},
                                copyOK[0]==='r' ? h(Icons.Check,{className:'w-3 h-3'}) : h(Icons.Copy,{className:'w-3 h-3'}),
                                copyOK[0]==='r' ? 'Copied!' : 'Copy'
                              ),
                              h('button', {onClick:function(){download(parsed.rU,'resume.txt');}, className:'flex items-center gap-1 px-3 py-1.5 bg-green-500 text-white rounded-lg text-sm font-medium hover:bg-green-600'},
                                h(Icons.Download,{className:'w-3 h-3'}), 'Download'
                              )
                            )
                          ),
                          h('div', {className:'bg-white p-4 rounded-lg'}, formatText(parsed.rU))
                        )
                      )
                  ),
                  tab[0]==='cover' && (
                    !didCover[0] ?
                      h('div', {className:'bg-purple-50 rounded-xl p-8 text-center'},
                        h(Icons.FileText, {className:'w-10 h-10 text-purple-300 mx-auto mb-3'}),
                        h('p', {className:'text-slate-500'}, 'No cover letter was analyzed')
                      ) :
                      h('div', {className:'space-y-6'},
                        (parsed.cA || parsed.cR) && h('div', {className:'bg-purple-50 rounded-xl p-5'},
                          h('h3', {className:'font-bold text-lg mb-4 text-slate-800'}, 'Analysis & Recommendations'),
                          parsed.cA && h('div', {className:'bg-white p-4 rounded-lg mb-4'}, formatText(parsed.cA)),
                          parsed.cR && h('div', {className:'bg-white p-4 rounded-lg'}, formatText(parsed.cR))
                        ),
                        parsed.cU && h('div', {className:'bg-green-50 rounded-xl p-5'},
                          h('div', {className:'flex items-center justify-between mb-4 flex-wrap gap-2'},
                            h('h3', {className:'font-bold text-lg text-slate-800'}, 'Updated Cover Letter'),
                            h('div', {className:'flex gap-2'},
                              h('button', {onClick:function(){copy(parsed.cU,'c');}, className:'flex items-center gap-1 px-3 py-1.5 bg-white border border-green-300 text-green-700 rounded-lg text-sm font-medium hover:bg-green-50'},
                                copyOK[0]==='c' ? h(Icons.Check,{className:'w-3 h-3'}) : h(Icons.Copy,{className:'w-3 h-3'}),
                                copyOK[0]==='c' ? 'Copied!' : 'Copy'
                              ),
                              h('button', {onClick:function(){download(parsed.cU,'cover-letter.txt');}, className:'flex items-center gap-1 px-3 py-1.5 bg-green-500 text-white rounded-lg text-sm font-medium hover:bg-green-600'},
                                h(Icons.Download,{className:'w-3 h-3'}), 'Download'
                              )
                            )
                          ),
                          h('div', {className:'bg-white p-4 rounded-lg'}, formatText(parsed.cU))
                        )
                      )
                  )
                )
              )
            )
          ),

          // Footer
          h('footer', {className:'bg-gradient-to-r from-slate-800 to-slate-900 mt-16'},
            h('div', {className:'max-w-6xl mx-auto px-4 py-8 text-center'},
              h('div', {className:'flex items-center justify-center gap-2 mb-3'},
                h('div', {className:'p-1.5 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-lg'},
                  h(Icons.Sparkles, {className:'w-4 h-4 text-white'})
                ),
                h('span', {className:'text-white font-bold'}, 'Resume AI Pro')
              ),
              h('p', {className:'text-slate-400 text-sm'}, 'Powered by Claude AI')
            )
          )
        );
      }

      document.getElementById('loading-screen').style.display = 'none';
      ReactDOM.createRoot(document.getElementById('root')).render(h(App));
    }
  </script>
</body>
</html>
